services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boutique_db
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier_dev_password
    ports:
      - "5433:5432"
    volumes:
      - boutique_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d boutique_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://atelier:atelier_dev_password@postgres:5432/boutique_db
      JWT_SECRET: change-this-in-production-use-a-random-secret
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  boutique_db_postgres_data:
