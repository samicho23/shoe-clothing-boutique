name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation files
        run: |
          test -f README.md
          test -f docs/api-documentation.md
          test -f docs/deployment-guide.md
          test -f backend/README.md
